[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-parser"
version = "0.1.0"
description = "Point-in-time financial data from SEC EDGAR filings (XBRL + filing text)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Haesou Im" }]
dependencies = [
    # Add runtime dependencies here as you need them (e.g. requests, pandas, duckdb).
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
